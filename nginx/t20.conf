# O NGINX NA FRENTE DA MESA (ALE-523): ele termina o TLS, COMPRIME e repassa
# tudo ao binário Go, que fala HTTP puro e cru na rede interna do compose.
#
# O que ele NÃO faz, de propósito, é bufferizar: o fluxo ao vivo da Mesa é
# SSE, e um proxy que acumula a resposta segura o quadro até o buffer encher —
# a mesa para de atualizar sem erro em lugar nenhum.

# O HTTP só existe para mandar ao HTTPS: quem digitar o IP sem o esquema cai
# aqui, e o navegador segue sozinho.
server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A COMPRESSÃO do que o Go renderiza, inclusive o SSE: a resposta de todo
    # comando do Datastar é `text/event-stream`, e a cena redesenhada viaja
    # 44 KB crus contra 5 KB em gzip. Com o repasse sem buffer, cada pedaço que
    # o Go esvazia chega com a marca de `flush`, e o gzip o despeja na hora em
    # vez de segurá-lo — medido na ALE-523. O PDF fica de fora: já é comprimido.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain text/event-stream application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://t20:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE: sem buffer, e uma conexão aberta por uma sessão inteira de jogo
        # não pode cair por inatividade entre dois turnos.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }
}
