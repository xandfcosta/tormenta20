# O NGINX NA FRENTE DA MESA (ALE-523): ele termina o TLS e repassa tudo ao
# binário Go, que fala HTTP puro na rede interna do compose.
#
# O que ele NÃO faz, de propósito:
#   - comprimir: o Go já comprime o que renderiza (`httpio.Gzip`), e comprimir
#     de novo só gastaria CPU;
#   - bufferizar: o fluxo ao vivo da Mesa é SSE, e um proxy que acumula a
#     resposta segura o quadro até o buffer encher — a mesa para de atualizar
#     sem erro em lugar nenhum.

# O HTTP só existe para mandar ao HTTPS: quem digitar o IP sem o esquema cai
# aqui, e o navegador segue sozinho.
server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip off;

    location / {
        proxy_pass http://t20:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE: sem buffer, e uma conexão aberta por uma sessão inteira de jogo
        # não pode cair por inatividade entre dois turnos.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }
}
