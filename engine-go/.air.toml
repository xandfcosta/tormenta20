# Air hot-reload do engine-go em dev (parte do `pnpm dev` do root, via concurrently).
# B.7 cutover: agora compila+reinicia a API Go (cmd/api :3001) — o server que o
# front consome via proxy do Vite (/api + /socket.io). O WASM é buildado pelo
# `predev` do frontend (scripts/build-engine-wasm.sh), então não é rebuildado aqui
# a cada mudança em .go (mais rápido). O env (JWT_SECRET/PORT) vem do
# `.env.development` deste diretório, lido pelo próprio binário (ALE-119) — o air
# roda com o CWD aqui, então o arquivo é achado sem configurar caminho nenhum.
# cmd/server (motor de bench :3002) continua existindo, só não roda no dev.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/engine-server ./cmd/api"
  bin = "./tmp/engine-server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "cmd/wasm/testdata"]
  stop_on_error = true
  # O binário agora encerra com ORDEM (ALE-157): ele recebe o sinal e espera as
  # requisições em curso. Sem estes dois, o air matava e subia o novo processo
  # antes de o antigo soltar a porta, e o resultado era um "address already in
  # use" seguido de MINUTOS servindo o binário anterior — com o código novo no
  # fonte e o comportamento velho na tela, que é a pior combinação para depurar
  # (aconteceu duas vezes, ALE-158 e ALE-166).
  send_interrupt = true
  kill_delay = "3s"

[log]
  time = true

[misc]
  clean_on_exit = true
