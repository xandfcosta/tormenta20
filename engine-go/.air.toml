# Air hot-reload do engine-go em dev (parte do `pnpm dev` do root, via concurrently).
# B.7 cutover: agora compila+reinicia a API Go (cmd/api :3001) — o server que o
# front consome via proxy do Vite (/api + /socket.io). O WASM é buildado pelo
# `predev` do frontend (scripts/build-engine-wasm.sh), então não é rebuildado aqui
# a cada mudança em .go (mais rápido). O env (JWT_SECRET/PORT) vem do script
# `dev` do engine-go. cmd/server (motor de bench :3002) continua existindo, só não
# roda no dev.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/engine-server ./cmd/api"
  bin = "./tmp/engine-server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "cmd/wasm/testdata"]
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
