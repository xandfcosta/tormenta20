# Air hot-reload do engine-go em dev — e ele É o `pnpm dev`, sem mais nada ao lado.
#
# Compila e reinicia o processo único (`cmd/api` na :3001), que serve as cenas, a
# API e o fluxo ao vivo. O env (JWT_SECRET/PORT) vem do `.env.development` deste
# diretório, lido pelo próprio binário (ALE-119) — o air roda com o CWD aqui,
# então o arquivo é achado sem configurar caminho nenhum.
#
# > Aqui morava a descrição de um front consumindo `/api` e `/socket.io` por
# > proxy do Vite, e de um WASM buildado pelo `predev` do frontend. Os três
# > saíram (socket.io na ALE-253, SPA e WASM na ALE-272) e o texto ficou,
# > descrevendo uma topologia que não existe (ALE-321).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/engine-server ./cmd/api"
  bin = "./tmp/engine-server"
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  stop_on_error = true
  # O binário agora encerra com ORDEM (ALE-157): ele recebe o sinal e espera as
  # requisições em curso. Sem estes dois, o air matava e subia o novo processo
  # antes de o antigo soltar a porta, e o resultado era um "address already in
  # use" seguido de MINUTOS servindo o binário anterior — com o código novo no
  # fonte e o comportamento velho na tela, que é a pior combinação para depurar
  # (aconteceu duas vezes, ALE-158 e ALE-166).
  send_interrupt = true
  kill_delay = "3s"

[log]
  time = true

[misc]
  clean_on_exit = true
