# Local-network stack: nginx serves the SPA + reverse-proxies the API/socket.io;
# the Nest API runs on a host-stored SQLite file. No TLS — intended for a trusted
# LAN over plain HTTP.
#
#   pnpm db:migrate          # apply migrations to ./data/app.db (host, once/updates)
#   docker compose up --build
#   open http://<host-lan-ip>:8080
#
# Migrations are NOT run inside the image (the API image has no Prisma CLI). Run
# `pnpm db:migrate` on the host before starting/upgrading. Back up the DB with
# `pnpm db:backup` (writes ./backups/app-<timestamp>.db).

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: file:/data/app.db
      # CHANGE this — signs session JWTs.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: 7d
      COOKIE_NAME: t20_session
      # LAN over plain HTTP: keep the cookie non-secure. Set COOKIE_SECURE=true
      # only if you terminate TLS in front.
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:8080
      NODE_ENV: production
      PORT: "3000"
    volumes:
      # SQLite file on the host disk (survives image rebuilds; back up directly).
      - ./data:/data
    expose:
      - "3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
