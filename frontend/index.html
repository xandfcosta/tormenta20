<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted via @font-face in src/index.css (Cinzel, OFL) —
         no CDN, so the app works offline and under a strict CSP (ALE-35). -->
    <title>Tormenta 20</title>
    <script>
      // Apply persisted theme before React mounts to avoid FOUC.
      // Mirrors zustand persist key in src/store/ui-store.ts.
      try {
        var raw = localStorage.getItem('t20-ui');
        var theme = raw ? JSON.parse(raw)?.state?.theme : null;
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
