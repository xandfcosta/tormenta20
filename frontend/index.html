<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
         anything but 0 — without it the notch/home-indicator padding written in
         scene-shell and the phone bars is dead code. Required for fullscreen and
         for the standalone (Add to Home Screen) window, where the app owns the
         whole panel. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Add to Home Screen: on iPhone this is the ONLY route to a chrome-less
         app (Safari has no Fullscreen API for elements), and it needs neither
         HTTPS nor a service worker — which is what makes it work over the LAN. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tormenta 20" />
    <!-- Edge-to-edge under the status bar; the safe-area padding above keeps the
         content out from under it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- O manifest é o que separa INSTALAR de criar um atalho (ALE-118): sem
         ele o "Adicionar à Tela de Início" do Android devolve um ícone que abre
         uma aba comum, com a barra de endereço de volta. O que ele espera é
         CONTEXTO SEGURO, e é aí que a LAN em `http://` esbarra — medido neste
         servidor: `window.isSecureContext` é false por `http://192.168.x.x` e
         true pelo mesmo endereço em `https://`. Esta linha fica aqui desde já
         porque não custa nada, o iPhone já aproveita o `apple-touch-icon`, e o
         dia em que houver certificado não há nada a lembrar de acrescentar.

         `display: "standalone"`, e NÃO `fullscreen`, é o único valor que dá a
         MESMA experiência nos dois sistemas — que é o que a issue pede. O iOS
         trata `fullscreen` como `standalone` de qualquer jeito, então escolher
         `fullscreen` só faria o Android esconder a barra de status e os dois
         aparelhos da mesa divergirem outra vez. De quebra a barra guarda o
         relógio e a bateria, que numa mesa de RPG são informação.
         Trocar de ideia é UMA palavra no `manifest.webmanifest`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- A cor da barra do sistema na janela instalada e do splash do Android.
         É o `--grimorio-bg` (oklch(0.15 0.01 305)) em sRGB — literal porque o
         manifest e esta meta são lidos antes de existir CSS para resolver um
         token. Se a cor do grimório mudar, os dois mudam juntos. -->
    <meta name="theme-color" content="#0c0a0f" />
    <!-- O iOS IGNORA os ícones do manifest e usa este; sem ele a Tela de Início
         ganha um print da página. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Fonts are self-hosted via @font-face in src/index.css (Cinzel, OFL) —
         no CDN, so the app works offline and under a strict CSP (ALE-35). -->
    <title>Tormenta 20</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
