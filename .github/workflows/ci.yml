name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.2'

jobs:
  ci:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The frontend's `prebuild` compiles engine-go → WASM, so the Go toolchain
      # is needed even for the JS build.
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `cena.js` e os ícones são gerados dos MESMOS fontes que a SPA usa
      # (ALE-231) e commitados, pelo mesmo motivo da folha e dos `_templ.go`:
      # `go build` num clone limpo não pode depender de rodar um gerador. O
      # guarda é o par recompila + `git diff --quiet`, como os outros três.
      #
      # O dos ÍCONES importa mais do que parece: ele lê o lucide instalado e
      # segue o APELIDO do pacote, então uma atualização que renomeie um ícone
      # aparece aqui em vez de a SPA e o Datastar passarem a desenhar coisas
      # diferentes em silêncio.
      - name: Rebuild the shared scene module and the icons
        run: |
          ./engine-go/scripts/build-piloto-js.sh
          node frontend/scripts/gen-icones-templ.mjs

      - name: Fail if the generated scene assets were stale
        run: |
          if ! git diff --quiet -- engine-go/api/piloto/static/cena.js engine-go/api/piloto_icones.templ; then
            echo "::error::cena.js ou os ícones estão desatualizados. Rode ./engine-go/scripts/build-piloto-js.sh e node frontend/scripts/gen-icones-templ.mjs, e commite."
            git diff --stat -- engine-go/api/piloto/static/cena.js engine-go/api/piloto_icones.templ
            exit 1
          fi

      # Os `_templ.go` também são artefato commitado, pelo mesmo motivo da folha
      # logo abaixo: `go build` num clone limpo não pode depender de rodar um
      # gerador. O guarda é o mesmo par recompila + `git diff --quiet` do
      # `TestGeneratedTypesAreCurrent`.
      - name: Regenerate the templ templates
        run: go tool templ generate
        working-directory: engine-go

      - name: Fail if the generated templates were stale
        run: |
          if ! git diff --quiet -- 'engine-go/api/*_templ.go'; then
            echo "::error::Os _templ.go estão desatualizados. Rode 'go tool templ generate' em engine-go/ e commite o resultado."
            git diff --stat -- 'engine-go/api/*_templ.go'
            exit 1
          fi

      # A folha do Datastar é um ARTEFATO COMMITADO (o `go:embed` não compila
      # sem ela), e artefato commitado apodrece em silêncio: uma classe nova num
      # template sem recompilar dá uma tela sem estilo, e nada reprova. Este
      # passo é o mesmo padrão que o repositório já usa duas vezes — o
      # `biome --write` logo abaixo e o `TestGeneratedTypesAreCurrent`.
      #
      # Ele existe porque a deriva JÁ aconteceu: a cópia em disco desta máquina
      # estava um build atrás da commitada quando o guarda foi escrito (ALE-225).
      - name: Recompile the Datastar stylesheet
        run: ./engine-go/scripts/build-piloto-css.sh

      - name: Fail if the stylesheet was stale
        run: |
          if ! git diff --quiet -- engine-go/api/piloto/static/; then
            echo "::error::A folha do Datastar está desatualizada. Rode ./engine-go/scripts/build-piloto-css.sh e commite o resultado."
            git diff --stat -- engine-go/api/piloto/static/
            exit 1
          fi

      - name: Biome lint (with fix)
        run: pnpm exec biome lint --write .

      - name: Fail if lint produced uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::biome lint --write modified files. Run 'pnpm lint:fix' locally and commit the results."
            git diff --stat
            exit 1
          fi

      - name: Tests
        run: pnpm test

      - name: Go engine tests
        run: go test ./...
        working-directory: engine-go

      - name: Build
        run: pnpm build

      # O typecheck NUNCA esteve no CI: até aqui, erro de tipo só aparecia na
      # máquina de quem lembrasse de rodar `pnpm typecheck`. Com o TypeScript 7
      # ele leva ~2s (eram ~13 no 6), então o passo custa menos que o `git
      # checkout` do job e fecha o buraco.
      #
      # Ele vem DEPOIS do build de propósito: o `routeTree.gen.ts` é gerado e
      # gitignored, e quem o escreve é o plugin do TanStack dentro de um
      # comando vite. Num clone limpo, sem ele, o `tsc` reprova as 26 rotas de
      # uma vez ("/campaigns/new is not assignable to parameter of type
      # undefined") — foi assim que este passo estreou vermelho.
      - name: Typecheck
        run: pnpm --filter frontend typecheck

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Needed twice here: to build the API binary, and by the frontend's
      # `predev`, which compiles engine-go → WASM before Vite starts.
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Build the Go API
        run: go build -o ./tmp/api ./cmd/api
        working-directory: engine-go

      # O e2e roda contra o BUILD, não contra o Vite (ALE-256): é 2,3× mais
      # rápido e — o que importa mais — é o CSS de produção que os guardas de
      # cor, contraste e tipografia passam a medir. Um deles passava em dev por
      # acidente, comparando o texto de uma custom property com um valor
      # computado; o minificador reescreve `oklch(0.27 …)` como `oklch(27% …)`.
      - name: Build the SPA
        run: pnpm --filter frontend build

      # The API migrates the SQLite file on open (goose), so it has to run once
      # before seed.sql — which is data-only (INSERTs, no DDL) — can apply.
      # É esta ordem que impede o `webServer` do Playwright de subir o servidor:
      # ele não tem onde encaixar a seed entre o migrar e o primeiro teste.
      - name: Start the API serving the build + apply the seed
        working-directory: engine-go
        env:
          JWT_SECRET: e2e-ci-secret
          PORT: '3010'
          COOKIE_NAME: t20_session
          STATIC_DIR: ../frontend/dist
        run: |
          ./tmp/api > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3010/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:3010/health > /dev/null || { cat api.log; exit 1; }
          # O controle que a ALE-256 pede: provar que é o BUILD que está sendo
          # servido, e não uma API sem SPA. Sem isto a suíte morreria em 404 com
          # cara de defeito do app.
          grep -q "serving built frontend" api.log || { cat api.log; exit 1; }
          sqlite3 data/t20-dev.db ".timeout 5000" ".read seed.sql"

      # Um servidor só, mesma origem para SPA e API — a forma de produção. Desde
      # a ALE-253 não há socket, então não há `/socket.io` a encaminhar nem
      # `CORS_ORIGIN` a declarar.
      - name: E2E
        env:
          E2E_BASE_URL: http://localhost:3010
          E2E_SERVIDOR_EXTERNO: '1'
        run: pnpm --filter e2e test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
