name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.2'

jobs:
  ci:
    name: lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The frontend's `prebuild` compiles engine-go → WASM, so the Go toolchain
      # is needed even for the JS build.
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A folha do Datastar é um ARTEFATO COMMITADO (o `go:embed` não compila
      # sem ela), e artefato commitado apodrece em silêncio: uma classe nova num
      # template sem recompilar dá uma tela sem estilo, e nada reprova. Este
      # passo é o mesmo padrão que o repositório já usa duas vezes — o
      # `biome --write` logo abaixo e o `TestGeneratedTypesAreCurrent`.
      #
      # Ele existe porque a deriva JÁ aconteceu: a cópia em disco desta máquina
      # estava um build atrás da commitada quando o guarda foi escrito (ALE-225).
      - name: Recompile the Datastar stylesheet
        run: ./engine-go/scripts/build-piloto-css.sh

      - name: Fail if the stylesheet was stale
        run: |
          if ! git diff --quiet -- engine-go/api/piloto/static/; then
            echo "::error::A folha do Datastar está desatualizada. Rode ./engine-go/scripts/build-piloto-css.sh e commite o resultado."
            git diff --stat -- engine-go/api/piloto/static/
            exit 1
          fi

      - name: Biome lint (with fix)
        run: pnpm exec biome lint --write .

      - name: Fail if lint produced uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::biome lint --write modified files. Run 'pnpm lint:fix' locally and commit the results."
            git diff --stat
            exit 1
          fi

      - name: Tests
        run: pnpm test

      - name: Go engine tests
        run: go test ./...
        working-directory: engine-go

      - name: Build
        run: pnpm build

      # O typecheck NUNCA esteve no CI: até aqui, erro de tipo só aparecia na
      # máquina de quem lembrasse de rodar `pnpm typecheck`. Com o TypeScript 7
      # ele leva ~2s (eram ~13 no 6), então o passo custa menos que o `git
      # checkout` do job e fecha o buraco.
      #
      # Ele vem DEPOIS do build de propósito: o `routeTree.gen.ts` é gerado e
      # gitignored, e quem o escreve é o plugin do TanStack dentro de um
      # comando vite. Num clone limpo, sem ele, o `tsc` reprova as 26 rotas de
      # uma vez ("/campaigns/new is not assignable to parameter of type
      # undefined") — foi assim que este passo estreou vermelho.
      - name: Typecheck
        run: pnpm --filter frontend typecheck

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Needed twice here: to build the API binary, and by the frontend's
      # `predev`, which compiles engine-go → WASM before Vite starts.
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Build the Go API
        run: go build -o ./tmp/api ./cmd/api
        working-directory: engine-go

      # The API migrates the SQLite file on open (goose), so it has to run once
      # before seed.sql — which is data-only (INSERTs, no DDL) — can apply.
      - name: Start the API + apply the seed
        working-directory: engine-go
        env:
          JWT_SECRET: e2e-ci-secret
          PORT: '3001'
          COOKIE_NAME: t20_session
        run: |
          ./tmp/api > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:3001/health > /dev/null || { cat api.log; exit 1; }
          sqlite3 data/t20-dev.db ".timeout 5000" ".read seed.sql"

      # Playwright's `webServer` starts Vite (:5173), which proxies /api + /socket.io
      # to the API above.
      - name: E2E
        run: pnpm --filter e2e test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
